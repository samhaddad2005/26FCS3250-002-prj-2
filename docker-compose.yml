services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuseats}
      POSTGRES_USER: ${POSTGRES_USER:-campuseats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuseats}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-campuseats}:${POSTGRES_PASSWORD:-campuseats}@db:5432/${POSTGRES_DB:-campuseats}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      TZ: ${TZ:-America/Denver}
    ports:
      - "${WEB_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: